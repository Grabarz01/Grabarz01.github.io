<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz Rejestracyjny</title>
    <link rel="stylesheet" href="formstyle.css">
</head>
<body>

    <div class="container">
        <h1>Formularz kontaktowy</h1>

        <form action="formularz.html" method="GET">
            <div class="form-group">
                <label for="username">Imię:</label>
                <input id="username" name="username" type="text" placeholder="Jan" required>
            </div>

            <div class="form-group">
                <label for="surname">Nazwisko:</label>
                <input id="surname" name="surname" type="text" placeholder="Kowalski" required>
            </div>

            <div class="form-group">
                <label for="street">Ulica i numer:</label>
                <input id="street" name="street" type="text" placeholder="ul. Długa 5/12">
            </div>

            <div class="form-group">
                <label for="city">Miasto:</label>
                <input id="city" name="city" type="text" placeholder="Warszawa">
            </div>

            <div class="form-group">
                <label for="province">Województwo:</label>
                <select id="province" name="province" required>
                    <option value="" disabled selected hidden>Wybierz województwo</option>
                    <option value="podlaskie">podlaskie</option>
                    <option value="mazowieckie">mazowieckie</option>
                    <option value="łódzkie">łódzkie</option>
                    <option value="wielkopolskie">wielkopolskie</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="jan.kowalski@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Hasło:</label>
                <input id="password" name="password" type="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="birthday">Data urodzenia:</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="form-group">
                <label for="phone">Nr telefonu:</label>
                <input type="tel" id="phone" name="phone" placeholder="123 456 789">
            </div>

            <div class="form-group">
                <label for="dlicence">Prawo jazdy:</label>
                <select id="dlicence" name="dlicence">
                    <option value="" disabled selected hidden>Wybierz opcję</option>
                    <option value="tak">Tak</option>
                    <option value="nie">Nie</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="comment">Uwagi:</label>
                <textarea id="comment" name="comment" rows="4" placeholder="Wpisz dodatkowe informacje..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Wyślij formularz</button>
        </form>
    </div>

</body>
</html>
